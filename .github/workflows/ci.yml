name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          check-latest: true
      - name: install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./... -race -coverprofile=coverage.out
      - name: coverage report
        run: |
          pct=$(go tool cover -func=coverage.out | awk '/^total:/ { print substr($3, 1, length($3)-1) }')
          echo "coverage: ${pct}%"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go build ./...

  vuln:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: run govulncheck
        run: govulncheck ./...

  tmux-3-2-integration:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: verify tmux version
        run: |
          TMUX_VERSION="$(tmux -V)"
          echo "tmux version: $TMUX_VERSION"
          if [ "$TMUX_VERSION" != "tmux 3.2a" ]; then
            echo "Error: unexpected tmux version: $TMUX_VERSION (expected tmux 3.2a)"
            exit 1
          fi
      - name: run tmux 3.2a integration tests
        run: go test -tags=tmuxintegration ./internal/tmux -run TestActiveTmux32 -count=1
